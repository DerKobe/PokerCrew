# Easiest start: sudo bash deploy/setup.sh  (creates .env)
# Manually:      DOMAIN=poker.example.com docker compose up -d --build
services:
  app:
    build: ..
    restart: unless-stopped
    environment:
      - PORT=3000
      # Optional TURN server (see below) for friends behind strict firewalls/mobile networks:
      - TURN_URL=${TURN_URL:-}
      - TURN_USERNAME=${TURN_USERNAME:-}
      - TURN_PASSWORD=${TURN_PASSWORD:-}
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?Please set DOMAIN, e.g. DOMAIN=poker.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Optional: your own TURN server (coturn). Only needed if voice does not connect for
  # some friends. Enable with: docker compose --profile turn up -d
  turn:
    image: coturn/coturn:4.6
    profiles: ["turn"]
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --listening-port=3478
      - --fingerprint
      - --lt-cred-mech
      - --user=${TURN_USERNAME:-poker}:${TURN_PASSWORD:-please-change}
      - --realm=${DOMAIN}
      - --external-ip=${TURN_EXTERNAL_IP:-}
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-tls
      - --no-dtls

volumes:
  caddy_data:
  caddy_config:
